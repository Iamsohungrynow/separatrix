[package]
name = "separatrix-cli"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "JSON stdin/stdout bridge to the separatrix portfolio solvers (see docs/workbench.md in the repo)."
publish = false

[[bin]]
name = "separatrix-cli"
path = "src/main.rs"

[dependencies]
separatrix = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# For --emit-qubo: the on-chain program seals a study against sha256 of the
# coefficient bytes, so the exporter must produce that digest identically.
sha2 = "0.10"
