[package]
name = "separatrix-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "JSON stdin/stdout bridge to the separatrix portfolio solvers (see docs/workbench.md in the repo)."
publish = false

[[bin]]
name = "separatrix-cli"
path = "src/main.rs"

[dependencies]
separatrix = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
