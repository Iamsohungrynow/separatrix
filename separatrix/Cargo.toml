[package]
name = "separatrix"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Martina <261225237+Iamsohungrynow@users.noreply.github.com>"]
description = "Quantum-inspired Ising/QUBO solvers: simulated bifurcation (bSB/dSB) with honest classical baselines (simulated annealing, parallel tempering, exact), plus a cardinality-constrained portfolio module with proven ground truth."
repository = "https://github.com/Iamsohungrynow/separatrix"
homepage = "https://separatrix.vercel.app"
documentation = "https://docs.rs/separatrix"
readme = "README.md"
keywords = ["ising", "qubo", "annealing", "optimization", "solver"]
categories = ["algorithms", "science", "mathematics"]

# Standalone workspace on purpose: the surrounding repo's root workspace is
# pinned to the Solana SBF toolchain (cargo 1.75, lockfile v3) and this crate's
# dependencies must never enter that lockfile. The cli member keeps serde out
# of the published library.
[workspace]
members = ["cli", "wasm"]

[features]
default = ["parallel"]
# Multi-threaded restarts/replicas via rayon. Disable for wasm32 builds.
parallel = ["dep:rayon"]

[dependencies]
num-traits = "0.2"
rand_core = "0.6"
rand_xoshiro = "0.8"
rayon = { version = "1.10", optional = true }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "solvers"
harness = false

# Fat LTO + one codegen unit: also what the wasm demo bundle wants, and cargo
# only honours profiles declared at the workspace root.
[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "thin"
