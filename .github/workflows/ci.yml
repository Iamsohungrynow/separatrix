name: ci

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python test suite
        run: python -m unittest discover -s tests -v

  typescript-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install Node dependencies
        run: npm ci
      - name: Run TypeScript checks
        run: npm run lint:ts
      - name: Guard the SBF lockfile (cargo 1.75 reads v3 only)
        run: npm run check:sbf-lockfile
      # Regenerate to a scratch path (NOT via `npm run -- <path>`, which appends
      # the argument after the script's own and would rewrite the committed
      # file, making this diff pass trivially).
      - name: Committed IDLs match their generators
        run: |
          node scripts/gen-idl.js "$RUNNER_TEMP/leash.json"
          node scripts/gen-separatrix-idl.js "$RUNNER_TEMP/separatrix.json"
          diff -u idl/leash.json "$RUNNER_TEMP/leash.json"
          diff -u idl/separatrix.json "$RUNNER_TEMP/separatrix.json"

  separatrix-crate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: separatrix
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - name: Test (unit, property, doc, cli protocol)
        run: cargo test --workspace
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check wasm32 build (no default features)
        run: cargo check --no-default-features --target wasm32-unknown-unknown
