name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (agent, workbench, on-chain vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Lint (ruff)
        run: python -m ruff check agent quantum scripts tests
      - name: Test
        run: python -m unittest discover -s tests -v

  quantum-primitives:
    # The pytket layer of the Dicke/XY characterisation. Selene (the Helios
    # emulator) and Guppy are exercised locally via requirements-quantinuum.txt;
    # their tests skip themselves here, and the report says which run they
    # came from. Pins match requirements-quantinuum.txt.
    name: Quantum primitives (numpy + pytket)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: >
          python -m pip install
          "numpy==2.5.2" "scipy==1.18.0"
          "pytket==2.18.1" "pytket-qiskit==0.77.0"
          "qiskit==2.5.2" "qiskit-ibm-runtime==0.49.0"
      - name: Test
        run: python -m unittest discover -s tests -p "test_quantum_dicke.py" -v

  typescript:
    name: TypeScript, IDLs, SBF lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Type-check bridges, scripts, and Anchor tests
        run: npm run lint:ts
      - name: Guard the SBF lockfile (cargo 1.75 reads v3 only)
        run: npm run check:sbf-lockfile
      # Regenerate to a scratch path (NOT via `npm run -- <path>`, which appends
      # the argument after the script's own and would rewrite the committed
      # file, making this diff pass trivially).
      - name: Committed IDLs match their generators
        run: |
          node scripts/gen-idl.js "$RUNNER_TEMP/leash.json"
          node scripts/gen-separatrix-idl.js "$RUNNER_TEMP/separatrix.json"
          diff -u idl/leash.json "$RUNNER_TEMP/leash.json"
          diff -u idl/separatrix.json "$RUNNER_TEMP/separatrix.json"

  studio:
    # The browser app in site/. It runs the committed WASM bundle
    # (site/public/pkg, rebuilt by scripts/build-wasm-demo.sh), so this job
    # needs no Rust toolchain.
    name: Studio (site/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests (problem library, Dicke engine)
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Deploy config parses
        # an unparseable vercel.json is ignored silently, taking the SPA
        # rewrite with it, and every deep link 404s in production
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"

  separatrix-crate:
    name: Rust solver crate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: separatrix
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: separatrix
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test (unit, property, doc, cli protocol)
        run: cargo test --workspace
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check wasm32 build (no default features)
        run: cargo check --no-default-features --target wasm32-unknown-unknown
      - name: Docs build without warnings
        run: cargo doc --no-deps -p separatrix
        env:
          RUSTDOCFLAGS: -D warnings
